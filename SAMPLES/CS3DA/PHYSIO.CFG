; CS3DA - Animation et physiologie du systeme circulatoire
;
; CYCLE : debut/fin systole auriculaire, debut/fin systole ventriculaire
;         (fractions du cycle cardiaque, 0 = onde P)
CYCLE 0.00 0.11 0.13 0.47
;
; Amplitude de contraction visible du coeur (fraction du volume apparent)
BEAT VENTRICLE 0.13
BEAT ATRIUM 0.11
;
; Vitesse de visualisation du sang (cm/s) selon le type de vaisseau
VELOCITY ARTERY 35
VELOCITY VEIN 20
VELOCITY CAPILLARY 6
;
; Amplitude de la pulsation du flux arteriel (0 = flux constant)
PULSATILITY 1.3
;
; Saturation en oxygene (%) : sang arteriel, sang veineux
SATURATION 98 75
;
; Volume telediastolique = volume d'ejection + ESV_BASE (mL)
ESV_BASE 50
;
; Profils : PROFILE nom HR=bpm SYS=mmHg DIA=mmHg SV=mL SPEED=facteur
PROFILE REST HR=72 SYS=120 DIA=80 SV=70 SPEED=1.0
PROFILE SLEEP HR=55 SYS=105 DIA=65 SV=75 SPEED=1.0
PROFILE EXERCISE HR=140 SYS=165 DIA=85 SV=105 SPEED=1.0
PROFILE ATHLETE HR=48 SYS=115 DIA=70 SV=110 SPEED=1.0
PROFILE TACHYCARDIA HR=130 SYS=125 DIA=75 SV=50 SPEED=1.0
PROFILE BRADYCARDIA HR=45 SYS=110 DIA=70 SV=80 SPEED=1.0
PROFILE HYPERTENSION HR=82 SYS=165 DIA=100 SV=70 SPEED=1.0
